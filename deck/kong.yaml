_format_version: "3.0"
# 保険ドメイン APIバンドル — Kong Gateway 宣言的設定 (decK)
#
# この段階では Service と Route のみを定義する(認証等のプラグインは後日追加)。
# 各 Service の host は docker-compose のサービス名に一致させており、
# Kong Data Plane が同一ネットワーク内のバックエンドへプロキシする。
#
# Konnect への反映:
#   deck gateway sync deck/kong.yaml \
#     --konnect-token <PAT> \
#     --konnect-control-plane-name <CP名>

services:
  - name: product
    host: product
    port: 8000
    protocol: http
    tags: ["insurance", "product"]
    routes:
      - name: product-route
        paths:
          - /product
        strip_path: true
        path_handling: v1
        tags: ["insurance", "product"]

  - name: customer
    host: customer
    port: 8000
    protocol: http
    tags: ["insurance", "customer"]
    routes:
      - name: customer-route
        paths:
          - /customer
        strip_path: true
        path_handling: v1
        tags: ["insurance", "customer"]

  - name: simulation
    host: simulation
    port: 8000
    protocol: http
    tags: ["insurance", "simulation"]
    routes:
      - name: simulation-route
        paths:
          - /simulation
        strip_path: true
        path_handling: v1
        tags: ["insurance", "simulation"]

  - name: application
    host: application
    port: 8000
    protocol: http
    tags: ["insurance", "application"]
    routes:
      - name: application-route
        paths:
          - /application
        strip_path: true
        path_handling: v1
        tags: ["insurance", "application"]

  - name: policy
    host: policy
    port: 8000
    protocol: http
    tags: ["insurance", "policy"]
    routes:
      - name: policy-route
        paths:
          - /policy
        strip_path: true
        path_handling: v1
        tags: ["insurance", "policy"]

  - name: claim
    host: claim
    port: 8000
    protocol: http
    tags: ["insurance", "claim"]
    routes:
      - name: claim-route
        paths:
          - /claim
        strip_path: true
        path_handling: v1
        tags: ["insurance", "claim"]
