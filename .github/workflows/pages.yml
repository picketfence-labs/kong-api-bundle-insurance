name: Publish OpenAPI Docs

# 各サービスのopenapi.yamlをScalar(CDN経由、ADR 0009)でレンダリングする静的サイトを
# 生成し、GitHub Pagesへ公開する。既存のrelease.yml(GHCR push)とは責務を分離し、
# 専用ワークフローとした(GHCRへの公開自動化は本リポジトリで特に慎重を要する領域のため、
# permissions・失敗時の影響範囲を分ける狙い)。
on:
  push:
    branches: [main]
    paths:
      - "services/*/openapi.yaml"
      - "scripts/build_openapi_docs_site.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build docs site
        run: ./scripts/build_openapi_docs_site.sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
