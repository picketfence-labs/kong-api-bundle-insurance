# 保険ドメイン APIバンドル — ローカル実行用 Docker Compose
#
# 6つのバックエンドサービス(FastAPI)と、Kong Konnect に接続する
# Kong Gateway (Data Plane, Hybrid mode) を起動する。
# Kong DP は Konnect の Control Plane に接続するため、.env に接続情報が必要。
# 詳細は docs/INSTRUCTIONS.md および .env.example を参照。

name: kong-insurance

x-service-base: &service-base
  build:
    context: .
    dockerfile: services/Dockerfile
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health').status==200 else sys.exit(1)"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  product:
    <<: *service-base
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: product
    container_name: insurance-product
    ports:
      - "8001:8000"

  customer:
    <<: *service-base
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: customer
    container_name: insurance-customer
    ports:
      - "8002:8000"

  simulation:
    <<: *service-base
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: simulation
    container_name: insurance-simulation
    ports:
      - "8003:8000"

  application:
    <<: *service-base
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: application
    container_name: insurance-application
    ports:
      - "8004:8000"

  policy:
    <<: *service-base
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: policy
    container_name: insurance-policy
    ports:
      - "8005:8000"

  claim:
    <<: *service-base
    build:
      context: .
      dockerfile: services/Dockerfile
      args:
        SERVICE: claim
    container_name: insurance-claim
    ports:
      - "8006:8000"

  # Kong Gateway (Data Plane) — Kong Konnect の Control Plane に接続する。
  # profiles: [konnect] を付けているため、既定では起動しない。
  # Konnect の接続情報を .env に設定した上で
  #   docker compose --profile konnect up -d
  # で起動する。
  kong-dp:
    image: kong/kong-gateway:3.15
    container_name: insurance-kong-dp
    profiles: ["konnect"]
    restart: unless-stopped
    environment:
      KONG_ROLE: data_plane
      KONG_DATABASE: "off"
      KONG_VITALS: "off"
      KONG_CLUSTER_MTLS: pki
      KONG_CLUSTER_CONTROL_PLANE: ${KONNECT_CP_ENDPOINT}
      KONG_CLUSTER_SERVER_NAME: ${KONNECT_CP_SERVER_NAME}
      KONG_CLUSTER_TELEMETRY_ENDPOINT: ${KONNECT_TP_ENDPOINT}
      KONG_CLUSTER_TELEMETRY_SERVER_NAME: ${KONNECT_TP_SERVER_NAME}
      KONG_CLUSTER_CERT: /run/secrets/tls.crt
      KONG_CLUSTER_CERT_KEY: /run/secrets/tls.key
      KONG_LUA_SSL_TRUSTED_CERTIFICATE: system
      KONG_KONNECT_MODE: "on"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes:
      - ./deck/certs/tls.crt:/run/secrets/tls.crt:ro
      - ./deck/certs/tls.key:/run/secrets/tls.key:ro
    ports:
      - "8000:8000"   # proxy (HTTP)
      - "8443:8443"   # proxy (HTTPS)
    depends_on:
      - product
      - customer
      - simulation
      - application
      - policy
      - claim
