openapi: 3.1.0
info:
  title: Property Insurance Application API
  description: Manage property insurance application (applications) submitted by customers
    for insurance products. Track underwriting review status, requested coverage and
    payment details, and the policy ID created when an application is approved.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Check service health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /applications:
    get:
      tags:
      - applications
      summary: List insurance applications
      description: List property insurance application (applications), optionally
        filtered by customer, product, or underwriting review status.
      operationId: list_applications_applications_get
      parameters:
      - name: customer_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance applications by applicant customer ID (CUS-NNNNNN).
          title: Customer Id
        description: Filter insurance applications by applicant customer ID (CUS-NNNNNN).
      - name: product_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance applications by selected insurance product
            ID (PRD-NNN).
          title: Product Id
        description: Filter insurance applications by selected insurance product ID
          (PRD-NNN).
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance applications by underwriting review status.
            Values remain in Japanese.
          title: Status
        description: Filter insurance applications by underwriting review status.
          Values remain in Japanese.
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of insurance applications to skip for pagination.
          default: 0
          title: Skip
        description: Number of insurance applications to skip for pagination.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of insurance applications to return (1 to 100).
          default: 50
          title: Limit
        description: Maximum number of insurance applications to return (1 to 100).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - applications
      summary: Create an insurance application
      description: Submit a property insurance application for a customer and insurance
        product.
      operationId: create_application_applications_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationBase'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /applications/{application_id}:
    get:
      tags:
      - applications
      summary: Get an insurance application
      description: Get one property insurance application by application ID, including
        its review outcome and resulting policy ID.
      operationId: get_application_applications__application_id__get
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance application to retrieve (APP-NNNNNN).
          title: Application Id
        description: ID of the insurance application to retrieve (APP-NNNNNN).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - applications
      summary: Update an insurance application
      description: Replace a property insurance application by application ID, including
        its underwriting review status.
      operationId: update_application_applications__application_id__put
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance application to update (APP-NNNNNN).
          title: Application Id
        description: ID of the insurance application to update (APP-NNNNNN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationBase'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - applications
      summary: Delete an insurance application
      description: Delete a property insurance application by application ID.
      operationId: delete_application_applications__application_id__delete
      parameters:
      - name: application_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance application to delete (APP-NNNNNN).
          title: Application Id
        description: ID of the insurance application to delete (APP-NNNNNN).
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Application:
      properties:
        customer_id:
          type: string
          title: Customer Id
          description: Customer ID of the property insurance applicant.
          examples:
          - CUS-000001
        product_id:
          type: string
          title: Product Id
          description: Insurance product ID selected in the application.
          examples:
          - PRD-001
        application_date:
          type: string
          title: Application Date
          description: Date the insurance application was submitted (YYYY-MM-DD).
        desired_sum_insured:
          type: integer
          title: Desired Sum Insured
          description: Requested insurance coverage amount or sum insured in Japanese
            yen.
        desired_payment_period:
          type: string
          title: Desired Payment Period
          description: Requested insurance premium payment period.
        payment_method:
          type: string
          title: Payment Method
          description: Method for paying the insurance premium.
          examples:
          - 口座振替
        health_declaration:
          anyOf:
          - $ref: '#/components/schemas/HealthDeclaration'
          - type: 'null'
          description: Health declaration for medical or accident insurance applications.
        beneficiary:
          anyOf:
          - $ref: '#/components/schemas/Beneficiary'
          - type: 'null'
          description: Benefit beneficiary for accident insurance death coverage.
        insured_pet:
          anyOf:
          - $ref: '#/components/schemas/InsuredPet'
          - type: 'null'
          description: Pet covered by a pet insurance application.
        status:
          type: string
          title: Status
          description: Insurance application underwriting review status. Values remain
            in Japanese.
          examples:
          - 承認
        reviewed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed At
          description: Date and time the insurance application review finished.
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
          description: Reason the insurance application was rejected, if applicable.
        resulting_policy_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resulting Policy Id
          description: Policy ID created from an approved insurance application, if
            applicable.
        application_id:
          type: string
          title: Application Id
          description: Insurance application ID (APP-NNNNNN).
          examples:
          - APP-000001
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - customer_id
      - product_id
      - application_date
      - desired_sum_insured
      - desired_payment_period
      - payment_method
      - status
      - application_id
      - created_at
      - updated_at
      title: Application
    ApplicationBase:
      properties:
        customer_id:
          type: string
          title: Customer Id
          description: Customer ID of the property insurance applicant.
          examples:
          - CUS-000001
        product_id:
          type: string
          title: Product Id
          description: Insurance product ID selected in the application.
          examples:
          - PRD-001
        application_date:
          type: string
          title: Application Date
          description: Date the insurance application was submitted (YYYY-MM-DD).
        desired_sum_insured:
          type: integer
          title: Desired Sum Insured
          description: Requested insurance coverage amount or sum insured in Japanese
            yen.
        desired_payment_period:
          type: string
          title: Desired Payment Period
          description: Requested insurance premium payment period.
        payment_method:
          type: string
          title: Payment Method
          description: Method for paying the insurance premium.
          examples:
          - 口座振替
        health_declaration:
          anyOf:
          - $ref: '#/components/schemas/HealthDeclaration'
          - type: 'null'
          description: Health declaration for medical or accident insurance applications.
        beneficiary:
          anyOf:
          - $ref: '#/components/schemas/Beneficiary'
          - type: 'null'
          description: Benefit beneficiary for accident insurance death coverage.
        insured_pet:
          anyOf:
          - $ref: '#/components/schemas/InsuredPet'
          - type: 'null'
          description: Pet covered by a pet insurance application.
        status:
          type: string
          title: Status
          description: Insurance application underwriting review status. Values remain
            in Japanese.
          examples:
          - 承認
        reviewed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Reviewed At
          description: Date and time the insurance application review finished.
        rejection_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Rejection Reason
          description: Reason the insurance application was rejected, if applicable.
        resulting_policy_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Resulting Policy Id
          description: Policy ID created from an approved insurance application, if
            applicable.
      type: object
      required:
      - customer_id
      - product_id
      - application_date
      - desired_sum_insured
      - desired_payment_period
      - payment_method
      - status
      title: ApplicationBase
    ApplicationList:
      properties:
        total:
          type: integer
          title: Total
        items:
          items:
            $ref: '#/components/schemas/Application'
          type: array
          title: Items
      type: object
      required:
      - total
      - items
      title: ApplicationList
    Beneficiary:
      properties:
        name:
          type: string
          title: Name
          description: Name of the insurance benefit beneficiary.
        relationship:
          type: string
          title: Relationship
          description: Beneficiary's relationship to the insured person.
          examples:
          - 配偶者
      type: object
      required:
      - name
      - relationship
      title: Beneficiary
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthDeclaration:
      properties:
        has_pre_existing_condition:
          type: boolean
          title: Has Pre Existing Condition
          description: Whether the applicant has a pre-existing medical condition.
        notes:
          anyOf:
          - type: string
          - type: 'null'
          title: Notes
          description: Additional health declaration or medical disclosure notes.
      type: object
      required:
      - has_pre_existing_condition
      title: HealthDeclaration
    InsuredPet:
      properties:
        species:
          type: string
          title: Species
          description: Species of the pet covered by pet insurance.
          examples:
          - 犬
        breed:
          type: string
          title: Breed
          description: Breed of the insured pet.
          examples:
          - トイプードル
        name:
          type: string
          title: Name
          description: Name of the insured pet.
          examples:
          - ポチ
        age:
          type: integer
          title: Age
          description: Age of the insured pet in years.
      type: object
      required:
      - species
      - breed
      - name
      - age
      title: InsuredPet
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: applications
  description: Read and manage property insurance application (applications).
servers:
- url: http://application.insurance.svc.cluster.local:8000
  description: Service inside the Kubernetes cluster
