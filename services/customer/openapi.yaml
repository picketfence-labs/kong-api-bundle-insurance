openapi: 3.1.0
info:
  title: Property Insurance Customer API
  description: 'Manage property insurance customer (customers) and policyholder records.
    Find personal details, Japanese addresses, contact information, My Number, and
    bank accounts used by insurance applications, policies, and claims.


    **My Number:** The current API returns the full `my_number` value. A future version
    may return a raw or masked value based on the caller''s role.'
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Check service health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /customers:
    get:
      tags:
      - customers
      summary: List insurance customers
      description: List property insurance customer (customers) and policyholders,
        optionally filtered by Japanese prefecture or gender.
      operationId: list_customers_customers_get
      parameters:
      - name: prefecture
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance customers by Japanese prefecture of residence.
            Values remain in Japanese.
          title: Prefecture
        description: Filter insurance customers by Japanese prefecture of residence.
          Values remain in Japanese.
      - name: gender
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance customers by gender. Values remain in Japanese.
          title: Gender
        description: Filter insurance customers by gender. Values remain in Japanese.
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of insurance customers to skip for pagination.
          default: 0
          title: Skip
        description: Number of insurance customers to skip for pagination.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of insurance customers to return (1 to 100).
          default: 50
          title: Limit
        description: Maximum number of insurance customers to return (1 to 100).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - customers
      summary: Create an insurance customer
      description: Register a property insurance customer with personal, contact,
        address, and bank account details.
      operationId: create_customer_customers_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerBase'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /customers/{customer_id}:
    get:
      tags:
      - customers
      summary: Get an insurance customer
      description: Get one property insurance customer or policyholder by customer
        ID.
      operationId: get_customer_customers__customer_id__get
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance customer to retrieve (CUS-NNNNNN).
          title: Customer Id
        description: ID of the insurance customer to retrieve (CUS-NNNNNN).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - customers
      summary: Update an insurance customer
      description: Replace a property insurance customer record by customer ID.
      operationId: update_customer_customers__customer_id__put
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance customer to update (CUS-NNNNNN).
          title: Customer Id
        description: ID of the insurance customer to update (CUS-NNNNNN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerBase'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - customers
      summary: Delete an insurance customer
      description: Delete a property insurance customer record by customer ID.
      operationId: delete_customer_customers__customer_id__delete
      parameters:
      - name: customer_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance customer to delete (CUS-NNNNNN).
          title: Customer Id
        description: ID of the insurance customer to delete (CUS-NNNNNN).
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    BankAccount:
      properties:
        bank_name:
          type: string
          title: Bank Name
          description: Name of the customer's bank.
          examples:
          - みずほ銀行
        branch_name:
          type: string
          title: Branch Name
          description: Name of the bank branch.
          examples:
          - 渋谷支店
        account_type:
          type: string
          title: Account Type
          description: Type of bank deposit account.
          examples:
          - 普通
        account_number:
          type: string
          title: Account Number
          description: Seven-digit bank account number.
          examples:
          - '1234567'
      type: object
      required:
      - bank_name
      - branch_name
      - account_type
      - account_number
      title: BankAccount
    Customer:
      properties:
        last_name:
          type: string
          title: Last Name
          description: Customer's family name.
          examples:
          - 山田
        first_name:
          type: string
          title: First Name
          description: Customer's given name.
          examples:
          - 太郎
        last_name_kana:
          type: string
          title: Last Name Kana
          description: Family name in full-width katakana.
          examples:
          - ヤマダ
        first_name_kana:
          type: string
          title: First Name Kana
          description: Given name in full-width katakana.
          examples:
          - タロウ
        birth_date:
          type: string
          title: Birth Date
          description: Customer's date of birth (YYYY-MM-DD).
          examples:
          - '1985-04-12'
        gender:
          type: string
          title: Gender
          description: Customer's gender. Values remain in Japanese.
          examples:
          - 男性
        my_number:
          type: string
          title: My Number
          description: Twelve-digit Japanese My Number; sample values are fictitious.
          examples:
          - '123456789018'
        postal_code:
          type: string
          title: Postal Code
          description: Japanese postal code (NNN-NNNN).
          examples:
          - 150-0002
        prefecture:
          type: string
          title: Prefecture
          description: Japanese prefecture in the customer's address; also filters
            customers by location.
          examples:
          - 東京都
        city:
          type: string
          title: City
          description: City, ward, or municipality in the customer's Japanese address.
          examples:
          - 渋谷区
        address_line:
          type: string
          title: Address Line
          description: Street address and building name.
          examples:
          - 1-2-3 パークタワー
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Customer's landline phone number.
        mobile_number:
          type: string
          title: Mobile Number
          description: Customer's mobile phone number.
          examples:
          - 090-1234-5678
        email:
          type: string
          title: Email
          description: Customer's email address.
          examples:
          - taro@example.com
        occupation:
          anyOf:
          - type: string
          - type: 'null'
          title: Occupation
          description: Customer's occupation.
        annual_income:
          anyOf:
          - type: integer
          - type: 'null'
          title: Annual Income
          description: Customer's annual income in Japanese yen.
        bank_account:
          anyOf:
          - $ref: '#/components/schemas/BankAccount'
          - type: 'null'
          description: Customer's bank account information.
        customer_since:
          type: string
          title: Customer Since
          description: Date the insurance customer was registered (YYYY-MM-DD).
        customer_id:
          type: string
          title: Customer Id
          description: Insurance customer ID (CUS-NNNNNN).
          examples:
          - CUS-000001
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - last_name
      - first_name
      - last_name_kana
      - first_name_kana
      - birth_date
      - gender
      - my_number
      - postal_code
      - prefecture
      - city
      - address_line
      - mobile_number
      - email
      - customer_since
      - customer_id
      - created_at
      - updated_at
      title: Customer
    CustomerBase:
      properties:
        last_name:
          type: string
          title: Last Name
          description: Customer's family name.
          examples:
          - 山田
        first_name:
          type: string
          title: First Name
          description: Customer's given name.
          examples:
          - 太郎
        last_name_kana:
          type: string
          title: Last Name Kana
          description: Family name in full-width katakana.
          examples:
          - ヤマダ
        first_name_kana:
          type: string
          title: First Name Kana
          description: Given name in full-width katakana.
          examples:
          - タロウ
        birth_date:
          type: string
          title: Birth Date
          description: Customer's date of birth (YYYY-MM-DD).
          examples:
          - '1985-04-12'
        gender:
          type: string
          title: Gender
          description: Customer's gender. Values remain in Japanese.
          examples:
          - 男性
        my_number:
          type: string
          title: My Number
          description: Twelve-digit Japanese My Number; sample values are fictitious.
          examples:
          - '123456789018'
        postal_code:
          type: string
          title: Postal Code
          description: Japanese postal code (NNN-NNNN).
          examples:
          - 150-0002
        prefecture:
          type: string
          title: Prefecture
          description: Japanese prefecture in the customer's address; also filters
            customers by location.
          examples:
          - 東京都
        city:
          type: string
          title: City
          description: City, ward, or municipality in the customer's Japanese address.
          examples:
          - 渋谷区
        address_line:
          type: string
          title: Address Line
          description: Street address and building name.
          examples:
          - 1-2-3 パークタワー
        phone_number:
          anyOf:
          - type: string
          - type: 'null'
          title: Phone Number
          description: Customer's landline phone number.
        mobile_number:
          type: string
          title: Mobile Number
          description: Customer's mobile phone number.
          examples:
          - 090-1234-5678
        email:
          type: string
          title: Email
          description: Customer's email address.
          examples:
          - taro@example.com
        occupation:
          anyOf:
          - type: string
          - type: 'null'
          title: Occupation
          description: Customer's occupation.
        annual_income:
          anyOf:
          - type: integer
          - type: 'null'
          title: Annual Income
          description: Customer's annual income in Japanese yen.
        bank_account:
          anyOf:
          - $ref: '#/components/schemas/BankAccount'
          - type: 'null'
          description: Customer's bank account information.
        customer_since:
          type: string
          title: Customer Since
          description: Date the insurance customer was registered (YYYY-MM-DD).
      type: object
      required:
      - last_name
      - first_name
      - last_name_kana
      - first_name_kana
      - birth_date
      - gender
      - my_number
      - postal_code
      - prefecture
      - city
      - address_line
      - mobile_number
      - email
      - customer_since
      title: CustomerBase
    CustomerList:
      properties:
        total:
          type: integer
          title: Total
        items:
          items:
            $ref: '#/components/schemas/Customer'
          type: array
          title: Items
      type: object
      required:
      - total
      - items
      title: CustomerList
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: customers
  description: Read and manage property insurance customer (customers) and policyholders.
servers:
- url: http://customer.insurance.svc.cluster.local:8000
  description: Service inside the Kubernetes cluster
