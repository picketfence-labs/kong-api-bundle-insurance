openapi: 3.1.0
info:
  title: Property Insurance Premium Simulation API
  description: Calculate a property insurance premium simulation (simulations) for
    an insurance product using customer age, sum insured, and smoking status. The
    API does not store simulations and uses the same premium calculation as insurance
    policies.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Check service health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /simulations:
    post:
      tags:
      - simulation
      summary: Calculate an insurance premium
      description: Create a property insurance premium simulation (simulations) or
        quote for a product and requested sum insured. Returns monthly and annual
        premium estimates without storing the result.
      operationId: simulate_simulations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Breakdown:
      properties:
        base_annual:
          type: integer
          title: Base Annual
          description: Base annual insurance premium in Japanese yen.
        variable_annual:
          type: integer
          title: Variable Annual
          description: Annual insurance premium component proportional to the sum
            insured, in Japanese yen.
        smoker_surcharge:
          type: integer
          title: Smoker Surcharge
          description: Annual smoker surcharge for medical or accident insurance,
            in Japanese yen.
        age_factor:
          type: number
          title: Age Factor
          description: Age factor used in the insurance premium calculation.
      type: object
      required:
      - base_annual
      - variable_annual
      - smoker_surcharge
      - age_factor
      title: Breakdown
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    SimulationRequest:
      properties:
        product_id:
          type: string
          title: Product Id
          description: Insurance product ID to quote or simulate (PRD-NNN).
          examples:
          - PRD-004
        birth_date:
          type: string
          title: Birth Date
          description: Customer's date of birth (YYYY-MM-DD), used to calculate age
            for the insurance premium.
          examples:
          - '1985-04-12'
        gender:
          type: string
          title: Gender
          description: Customer's gender, retained in the simulation request. Values
            remain in Japanese.
          default: 回答しない
          examples:
          - 男性
        sum_insured:
          type: integer
          title: Sum Insured
          description: Requested insurance coverage amount or sum insured in Japanese
            yen.
          examples:
          - 3000000
        payment_period:
          anyOf:
          - type: string
          - type: 'null'
          title: Payment Period
          description: Requested insurance premium payment period; retained in the
            simulation request.
          examples:
          - 1年（自動更新）
        smoker_flag:
          type: boolean
          title: Smoker Flag
          description: Whether the customer smokes; increases premiums for medical
            and accident insurance.
          default: false
      type: object
      required:
      - product_id
      - birth_date
      - sum_insured
      title: SimulationRequest
    SimulationResponse:
      properties:
        product_id:
          type: string
          title: Product Id
        product_name:
          type: string
          title: Product Name
        category:
          type: string
          title: Category
        age:
          type: integer
          title: Age
          description: Customer's age on the simulation date.
        sum_insured:
          type: integer
          title: Sum Insured
        monthly_premium:
          type: integer
          title: Monthly Premium
          description: Estimated monthly insurance premium in Japanese yen.
        annual_premium:
          type: integer
          title: Annual Premium
          description: Estimated annual insurance premium in Japanese yen.
        breakdown:
          $ref: '#/components/schemas/Breakdown'
      type: object
      required:
      - product_id
      - product_name
      - category
      - age
      - sum_insured
      - monthly_premium
      - annual_premium
      - breakdown
      title: SimulationResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: simulation
  description: Calculate property insurance premium simulation (simulations) and quotes.
servers:
- url: http://simulation.insurance.svc.cluster.local:8000
  description: Service inside the Kubernetes cluster
