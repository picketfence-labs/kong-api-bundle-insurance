openapi: 3.1.0
info:
  title: Property Insurance Claim API
  description: Manage property insurance claim (claims) against insurance policies.
    Find claimants, claim types, incident dates, requested and paid amounts, and claim
    review or payment status.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Check service health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /claims:
    get:
      tags:
      - claims
      summary: List insurance claims
      description: List property insurance claim (claims), optionally filtered by
        insurance policy, claimant customer, or claim review status.
      operationId: list_claims_claims_get
      parameters:
      - name: policy_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance claims by the policy ID (POL-NNNNNN) on which
            the claims were filed.
          title: Policy Id
        description: Filter insurance claims by the policy ID (POL-NNNNNN) on which
          the claims were filed.
      - name: customer_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance claims by claimant customer ID (CUS-NNNNNN).
          title: Customer Id
        description: Filter insurance claims by claimant customer ID (CUS-NNNNNN).
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance claims by claim review or payment status.
            Values remain in Japanese.
          title: Status
        description: Filter insurance claims by claim review or payment status. Values
          remain in Japanese.
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of insurance claims to skip for pagination.
          default: 0
          title: Skip
        description: Number of insurance claims to skip for pagination.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of insurance claims to return (1 to 100).
          default: 50
          title: Limit
        description: Maximum number of insurance claims to return (1 to 100).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - claims
      summary: Create an insurance claim
      description: File a property insurance claim against an insurance policy.
      operationId: create_claim_claims_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimBase'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /claims/{claim_id}:
    get:
      tags:
      - claims
      summary: Get an insurance claim
      description: Get one property insurance claim by claim ID, including the loss,
        requested amount, and payment status.
      operationId: get_claim_claims__claim_id__get
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance claim to retrieve (CLM-NNNNNN).
          title: Claim Id
        description: ID of the insurance claim to retrieve (CLM-NNNNNN).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - claims
      summary: Update an insurance claim
      description: Replace a property insurance claim by claim ID, including review
        and payment details.
      operationId: update_claim_claims__claim_id__put
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance claim to update (CLM-NNNNNN).
          title: Claim Id
        description: ID of the insurance claim to update (CLM-NNNNNN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimBase'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Claim'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - claims
      summary: Delete an insurance claim
      description: Delete a property insurance claim by claim ID.
      operationId: delete_claim_claims__claim_id__delete
      parameters:
      - name: claim_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance claim to delete (CLM-NNNNNN).
          title: Claim Id
        description: ID of the insurance claim to delete (CLM-NNNNNN).
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Claim:
      properties:
        policy_id:
          type: string
          title: Policy Id
          description: Insurance policy ID against which the claim is filed.
          examples:
          - POL-000001
        customer_id:
          type: string
          title: Customer Id
          description: Customer ID of the insurance claimant.
          examples:
          - CUS-000001
        claim_type:
          type: string
          title: Claim Type
          description: Type of insurance claim or covered loss; depends on the policy's
            product category. Values remain in Japanese.
          examples:
          - 入院
        incident_date:
          type: string
          title: Incident Date
          description: Date of the accident, loss, or event behind the claim (YYYY-MM-DD).
        claim_date:
          type: string
          title: Claim Date
          description: Date the insurance claim was filed (YYYY-MM-DD).
        claim_amount_requested:
          type: integer
          title: Claim Amount Requested
          description: Insurance claim amount requested in Japanese yen.
        claim_amount_paid:
          anyOf:
          - type: integer
          - type: 'null'
          title: Claim Amount Paid
          description: Final insurance claim payment amount in Japanese yen, if determined.
        status:
          type: string
          title: Status
          description: Insurance claim review or payment status. Values remain in
            Japanese.
          examples:
          - 支払済
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Details of the insurance claim, incident, and covered loss.
        processed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Processed At
          description: Date and time the insurance claim review finished.
        claim_id:
          type: string
          title: Claim Id
          description: Insurance claim ID (CLM-NNNNNN).
          examples:
          - CLM-000001
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - policy_id
      - customer_id
      - claim_type
      - incident_date
      - claim_date
      - claim_amount_requested
      - status
      - claim_id
      - created_at
      - updated_at
      title: Claim
    ClaimBase:
      properties:
        policy_id:
          type: string
          title: Policy Id
          description: Insurance policy ID against which the claim is filed.
          examples:
          - POL-000001
        customer_id:
          type: string
          title: Customer Id
          description: Customer ID of the insurance claimant.
          examples:
          - CUS-000001
        claim_type:
          type: string
          title: Claim Type
          description: Type of insurance claim or covered loss; depends on the policy's
            product category. Values remain in Japanese.
          examples:
          - 入院
        incident_date:
          type: string
          title: Incident Date
          description: Date of the accident, loss, or event behind the claim (YYYY-MM-DD).
        claim_date:
          type: string
          title: Claim Date
          description: Date the insurance claim was filed (YYYY-MM-DD).
        claim_amount_requested:
          type: integer
          title: Claim Amount Requested
          description: Insurance claim amount requested in Japanese yen.
        claim_amount_paid:
          anyOf:
          - type: integer
          - type: 'null'
          title: Claim Amount Paid
          description: Final insurance claim payment amount in Japanese yen, if determined.
        status:
          type: string
          title: Status
          description: Insurance claim review or payment status. Values remain in
            Japanese.
          examples:
          - 支払済
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
          description: Details of the insurance claim, incident, and covered loss.
        processed_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Processed At
          description: Date and time the insurance claim review finished.
      type: object
      required:
      - policy_id
      - customer_id
      - claim_type
      - incident_date
      - claim_date
      - claim_amount_requested
      - status
      title: ClaimBase
    ClaimList:
      properties:
        total:
          type: integer
          title: Total
        items:
          items:
            $ref: '#/components/schemas/Claim'
          type: array
          title: Items
      type: object
      required:
      - total
      - items
      title: ClaimList
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: claims
  description: Read and manage property insurance claim (claims).
servers:
- url: http://claim.insurance.svc.cluster.local:8000
  description: Service inside the Kubernetes cluster
