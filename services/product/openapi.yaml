openapi: 3.1.0
info:
  title: Property Insurance Product API
  description: Manage property insurance product (products) and coverage offerings.
    Find fire, auto, accident, medical, and pet insurance products, including coverage,
    eligibility, insured amounts, premium rates, riders, and sales status.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Check service health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /products:
    get:
      tags:
      - products
      summary: List insurance products
      description: List property insurance product (products), optionally filtered
        by insurance category or sales status.
      operationId: list_products_products_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance products by product category, such as fire,
            auto, accident, medical, or pet insurance. Values remain in Japanese.
          title: Category
        description: Filter insurance products by product category, such as fire,
          auto, accident, medical, or pet insurance. Values remain in Japanese.
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance products by sales status. Values remain in
            Japanese.
          title: Status
        description: Filter insurance products by sales status. Values remain in Japanese.
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of insurance products to skip for pagination.
          default: 0
          title: Skip
        description: Number of insurance products to skip for pagination.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of insurance products to return (1 to 100).
          default: 50
          title: Limit
        description: Maximum number of insurance products to return (1 to 100).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - products
      summary: Create an insurance product
      description: Create a property insurance product with coverage, eligibility,
        and premium rate details.
      operationId: create_product_products_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductBase'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /products/{product_id}:
    get:
      tags:
      - products
      summary: Get an insurance product
      description: Get one property insurance product by its product ID, including
        coverage and premium details.
      operationId: get_product_products__product_id__get
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance product to retrieve (PRD-NNN).
          title: Product Id
        description: ID of the insurance product to retrieve (PRD-NNN).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - products
      summary: Update an insurance product
      description: Replace a property insurance product by its product ID.
      operationId: update_product_products__product_id__put
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance product to update (PRD-NNN).
          title: Product Id
        description: ID of the insurance product to update (PRD-NNN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductBase'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - products
      summary: Delete an insurance product
      description: Delete a property insurance product by its product ID.
      operationId: delete_product_products__product_id__delete
      parameters:
      - name: product_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance product to delete (PRD-NNN).
          title: Product Id
        description: ID of the insurance product to delete (PRD-NNN).
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    PremiumRateTable:
      properties:
        annual_rate_on_sum_insured:
          type: number
          title: Annual Rate On Sum Insured
          description: Annual premium rate applied to the sum insured.
        annual_base_premium:
          type: integer
          title: Annual Base Premium
          description: Base annual insurance premium in Japanese yen.
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
          description: Additional notes about the insurance premium rate.
      type: object
      required:
      - annual_rate_on_sum_insured
      - annual_base_premium
      title: PremiumRateTable
    Product:
      properties:
        product_code:
          type: string
          title: Product Code
          description: Internal code for the insurance product.
          examples:
          - FIRE-STD
        product_name:
          type: string
          title: Product Name
          description: Insurance product name, including its marketing name.
          examples:
          - 火災保険「住まいの安心」
        category:
          type: string
          title: Category
          description: Insurance product category, such as fire, auto, accident, medical,
            or pet insurance.
          examples:
          - 火災保険
        description:
          type: string
          title: Description
          description: Description of the insurance product and its purpose.
        coverage_summary:
          type: string
          title: Coverage Summary
          description: Summary of coverage under the main insurance policy.
        min_age:
          type: integer
          title: Min Age
          description: Minimum eligible age for this insurance product.
          examples:
          - 18
        max_age:
          type: integer
          title: Max Age
          description: Maximum eligible age for this insurance product.
          examples:
          - 99
        policy_term:
          type: string
          title: Policy Term
          description: Coverage period or term of the insurance policy.
          examples:
          - 1〜5年
        min_sum_insured:
          type: integer
          title: Min Sum Insured
          description: Minimum sum insured in Japanese yen.
        max_sum_insured:
          type: integer
          title: Max Sum Insured
          description: Maximum sum insured in Japanese yen.
        premium_rate_table:
          $ref: '#/components/schemas/PremiumRateTable'
          description: Rates and factors used to calculate insurance premiums.
        riders:
          items:
            type: string
          type: array
          title: Riders
          description: Optional riders available for this insurance product.
        status:
          type: string
          title: Status
          description: Sales status of the insurance product.
          examples:
          - 販売中
        product_id:
          type: string
          title: Product Id
          description: Insurance product ID (PRD-NNN).
          examples:
          - PRD-001
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - product_code
      - product_name
      - category
      - description
      - coverage_summary
      - min_age
      - max_age
      - policy_term
      - min_sum_insured
      - max_sum_insured
      - premium_rate_table
      - status
      - product_id
      - created_at
      - updated_at
      title: Product
    ProductBase:
      properties:
        product_code:
          type: string
          title: Product Code
          description: Internal code for the insurance product.
          examples:
          - FIRE-STD
        product_name:
          type: string
          title: Product Name
          description: Insurance product name, including its marketing name.
          examples:
          - 火災保険「住まいの安心」
        category:
          type: string
          title: Category
          description: Insurance product category, such as fire, auto, accident, medical,
            or pet insurance.
          examples:
          - 火災保険
        description:
          type: string
          title: Description
          description: Description of the insurance product and its purpose.
        coverage_summary:
          type: string
          title: Coverage Summary
          description: Summary of coverage under the main insurance policy.
        min_age:
          type: integer
          title: Min Age
          description: Minimum eligible age for this insurance product.
          examples:
          - 18
        max_age:
          type: integer
          title: Max Age
          description: Maximum eligible age for this insurance product.
          examples:
          - 99
        policy_term:
          type: string
          title: Policy Term
          description: Coverage period or term of the insurance policy.
          examples:
          - 1〜5年
        min_sum_insured:
          type: integer
          title: Min Sum Insured
          description: Minimum sum insured in Japanese yen.
        max_sum_insured:
          type: integer
          title: Max Sum Insured
          description: Maximum sum insured in Japanese yen.
        premium_rate_table:
          $ref: '#/components/schemas/PremiumRateTable'
          description: Rates and factors used to calculate insurance premiums.
        riders:
          items:
            type: string
          type: array
          title: Riders
          description: Optional riders available for this insurance product.
        status:
          type: string
          title: Status
          description: Sales status of the insurance product.
          examples:
          - 販売中
      type: object
      required:
      - product_code
      - product_name
      - category
      - description
      - coverage_summary
      - min_age
      - max_age
      - policy_term
      - min_sum_insured
      - max_sum_insured
      - premium_rate_table
      - status
      title: ProductBase
    ProductList:
      properties:
        total:
          type: integer
          title: Total
        items:
          items:
            $ref: '#/components/schemas/Product'
          type: array
          title: Items
      type: object
      required:
      - total
      - items
      title: ProductList
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: products
  description: Read and manage property insurance product (products).
servers:
- url: http://product.insurance.svc.cluster.local:8000
  description: Service inside the Kubernetes cluster
