openapi: 3.1.0
info:
  title: Property Insurance Policy API
  description: Manage property insurance policy (policies) created from approved applications.
    Find policy numbers, policyholders, insured products, coverage amounts, premiums,
    terms, beneficiaries, and status. Insurance claims refer to these policies.
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Check service health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /policies:
    get:
      tags:
      - policies
      summary: List insurance policies
      description: List property insurance policy (policies), optionally filtered
        by policyholder customer, insurance product, or policy status.
      operationId: list_policies_policies_get
      parameters:
      - name: customer_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance policies by policyholder customer ID (CUS-NNNNNN).
          title: Customer Id
        description: Filter insurance policies by policyholder customer ID (CUS-NNNNNN).
      - name: product_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance policies by covered insurance product ID (PRD-NNN).
          title: Product Id
        description: Filter insurance policies by covered insurance product ID (PRD-NNN).
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filter insurance policies by policy status. Values remain in
            Japanese.
          title: Status
        description: Filter insurance policies by policy status. Values remain in
          Japanese.
      - name: skip
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          description: Number of insurance policies to skip for pagination.
          default: 0
          title: Skip
        description: Number of insurance policies to skip for pagination.
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Maximum number of insurance policies to return (1 to 100).
          default: 50
          title: Limit
        description: Maximum number of insurance policies to return (1 to 100).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - policies
      summary: Create an insurance policy
      description: Create a property insurance policy from an approved application.
      operationId: create_policy_policies_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyBase'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /policies/{policy_id}:
    get:
      tags:
      - policies
      summary: Get an insurance policy
      description: Get one property insurance policy by policy ID, including coverage,
        premium, and policyholder details.
      operationId: get_policy_policies__policy_id__get
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance policy to retrieve (POL-NNNNNN).
          title: Policy Id
        description: ID of the insurance policy to retrieve (POL-NNNNNN).
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - policies
      summary: Update an insurance policy
      description: Replace a property insurance policy by policy ID.
      operationId: update_policy_policies__policy_id__put
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance policy to update (POL-NNNNNN).
          title: Policy Id
        description: ID of the insurance policy to update (POL-NNNNNN).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyBase'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - policies
      summary: Delete an insurance policy
      description: Delete a property insurance policy by policy ID.
      operationId: delete_policy_policies__policy_id__delete
      parameters:
      - name: policy_id
        in: path
        required: true
        schema:
          type: string
          description: ID of the insurance policy to delete (POL-NNNNNN).
          title: Policy Id
        description: ID of the insurance policy to delete (POL-NNNNNN).
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Beneficiary:
      properties:
        name:
          type: string
          title: Name
          description: Name of the insurance benefit beneficiary.
        relationship:
          type: string
          title: Relationship
          description: Beneficiary's relationship to the insured person.
      type: object
      required:
      - name
      - relationship
      title: Beneficiary
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InsuredPet:
      properties:
        species:
          type: string
          title: Species
          description: Species of the pet covered by pet insurance.
        breed:
          type: string
          title: Breed
          description: Breed of the insured pet.
        name:
          type: string
          title: Name
          description: Name of the insured pet.
        age:
          type: integer
          title: Age
          description: Age of the insured pet in years.
      type: object
      required:
      - species
      - breed
      - name
      - age
      title: InsuredPet
    Policy:
      properties:
        policy_number:
          type: string
          title: Policy Number
          description: Insurance policy number printed on the policy document.
          examples:
          - 2025-FIRE-000001
        application_id:
          type: string
          title: Application Id
          description: Approved insurance application ID that resulted in this policy.
          examples:
          - APP-000001
        customer_id:
          type: string
          title: Customer Id
          description: Customer ID of the insurance policyholder.
          examples:
          - CUS-000001
        product_id:
          type: string
          title: Product Id
          description: Insurance product ID covered by this policy.
          examples:
          - PRD-001
        contract_date:
          type: string
          title: Contract Date
          description: Date the insurance policy was contracted (YYYY-MM-DD).
        effective_date:
          type: string
          title: Effective Date
          description: Date insurance coverage begins (YYYY-MM-DD).
        expiry_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Expiry Date
          description: Date insurance coverage ends (YYYY-MM-DD), if set.
        sum_insured:
          type: integer
          title: Sum Insured
          description: Insurance policy coverage amount or sum insured in Japanese
            yen.
        premium_amount:
          type: integer
          title: Premium Amount
          description: Insurance policy premium amount in Japanese yen.
        premium_payment_cycle:
          type: string
          title: Premium Payment Cycle
          description: Frequency of insurance premium payments.
          examples:
          - 月払
        payment_method:
          type: string
          title: Payment Method
          description: Method for paying the insurance premium.
          examples:
          - 口座振替
        status:
          type: string
          title: Status
          description: Insurance policy status. Values remain in Japanese.
          examples:
          - 有効
        beneficiary:
          anyOf:
          - $ref: '#/components/schemas/Beneficiary'
          - type: 'null'
          description: Insurance benefit beneficiary information.
        insured_pet:
          anyOf:
          - $ref: '#/components/schemas/InsuredPet'
          - type: 'null'
          description: Pet covered by this pet insurance policy.
        riders:
          items:
            type: string
          type: array
          title: Riders
          description: Optional insurance riders attached to this policy.
        policy_id:
          type: string
          title: Policy Id
          description: Insurance policy ID (POL-NNNNNN).
          examples:
          - POL-000001
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
      type: object
      required:
      - policy_number
      - application_id
      - customer_id
      - product_id
      - contract_date
      - effective_date
      - sum_insured
      - premium_amount
      - premium_payment_cycle
      - payment_method
      - status
      - policy_id
      - created_at
      - updated_at
      title: Policy
    PolicyBase:
      properties:
        policy_number:
          type: string
          title: Policy Number
          description: Insurance policy number printed on the policy document.
          examples:
          - 2025-FIRE-000001
        application_id:
          type: string
          title: Application Id
          description: Approved insurance application ID that resulted in this policy.
          examples:
          - APP-000001
        customer_id:
          type: string
          title: Customer Id
          description: Customer ID of the insurance policyholder.
          examples:
          - CUS-000001
        product_id:
          type: string
          title: Product Id
          description: Insurance product ID covered by this policy.
          examples:
          - PRD-001
        contract_date:
          type: string
          title: Contract Date
          description: Date the insurance policy was contracted (YYYY-MM-DD).
        effective_date:
          type: string
          title: Effective Date
          description: Date insurance coverage begins (YYYY-MM-DD).
        expiry_date:
          anyOf:
          - type: string
          - type: 'null'
          title: Expiry Date
          description: Date insurance coverage ends (YYYY-MM-DD), if set.
        sum_insured:
          type: integer
          title: Sum Insured
          description: Insurance policy coverage amount or sum insured in Japanese
            yen.
        premium_amount:
          type: integer
          title: Premium Amount
          description: Insurance policy premium amount in Japanese yen.
        premium_payment_cycle:
          type: string
          title: Premium Payment Cycle
          description: Frequency of insurance premium payments.
          examples:
          - 月払
        payment_method:
          type: string
          title: Payment Method
          description: Method for paying the insurance premium.
          examples:
          - 口座振替
        status:
          type: string
          title: Status
          description: Insurance policy status. Values remain in Japanese.
          examples:
          - 有効
        beneficiary:
          anyOf:
          - $ref: '#/components/schemas/Beneficiary'
          - type: 'null'
          description: Insurance benefit beneficiary information.
        insured_pet:
          anyOf:
          - $ref: '#/components/schemas/InsuredPet'
          - type: 'null'
          description: Pet covered by this pet insurance policy.
        riders:
          items:
            type: string
          type: array
          title: Riders
          description: Optional insurance riders attached to this policy.
      type: object
      required:
      - policy_number
      - application_id
      - customer_id
      - product_id
      - contract_date
      - effective_date
      - sum_insured
      - premium_amount
      - premium_payment_cycle
      - payment_method
      - status
      title: PolicyBase
    PolicyList:
      properties:
        total:
          type: integer
          title: Total
        items:
          items:
            $ref: '#/components/schemas/Policy'
          type: array
          title: Items
      type: object
      required:
      - total
      - items
      title: PolicyList
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: policies
  description: Read and manage property insurance policy (policies).
servers:
- url: http://policy.insurance.svc.cluster.local:8000
  description: Service inside the Kubernetes cluster
