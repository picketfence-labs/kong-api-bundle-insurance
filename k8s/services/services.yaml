# 6つのFastAPIサービスの Deployment と Service。
# イメージは Minikube のローカルDockerにビルドしたものをそのまま使う
# (imagePullPolicy: IfNotPresent)。Service名 = サービス名とし、Kong の
# KongService がクラスタ内DNS(<svc>.insurance.svc)で到達できるようにする。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: product
  namespace: insurance
  labels: { app: product }
spec:
  replicas: 1
  selector: { matchLabels: { app: product } }
  template:
    metadata:
      labels: { app: product }
    spec:
      containers:
        - name: product
          image: insurance-product:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "96Mi" }
            limits: { cpu: "250m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: product
  namespace: insurance
spec:
  selector: { app: product }
  ports: [{ port: 8000, targetPort: 8000 }]
