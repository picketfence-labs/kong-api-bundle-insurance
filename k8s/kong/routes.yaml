# Service と Route を Kong Operator の CRD で定義する。
# controlPlaneRef で Konnect の Control Plane(insurance-cp) を指すため、
# これらは Konnect 側のエンティティとして同期され、DataPlane がプロキシする。
# host は同一 namespace のバックエンド Service 名(<svc>.insurance.svc)を指す。
---
apiVersion: configuration.konghq.com/v1alpha1
kind: KongService
metadata:
  name: product
  namespace: insurance
spec:
  name: product
  controlPlaneRef:
    type: konnectNamespacedRef
    konnectNamespacedRef:
      name: insurance-cp
  protocol: http
  host: product
  port: 8000
  tags: ["insurance", "product"]
---
apiVersion: configuration.konghq.com/v1alpha1
kind: KongRoute
metadata:
  name: product-route
  namespace: insurance
spec:
  name: product-route
  serviceRef:
    type: namespacedRef
    namespacedRef:
      name: product
  paths: ["/product"]
  strip_path: true
  tags: ["insurance", "product"]
